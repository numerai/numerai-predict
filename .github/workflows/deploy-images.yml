name: Deploy All Images

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: numerai_predict
  MODEL_UPLOADS_ECR_ACCOUNT_ID: ${{ github.ref == 'refs/heads/staging' && secrets.MODEL_UPLOADS_STAGING_ACCOUNT_ID || secrets.MODEL_UPLOADS_ACCOUNT_ID }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

jobs:
  public-images:
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        python-version: ['3{0}10', '3{0}11', '3{0}12', '3{0}13', '3{0}14']
    runs-on: ubuntu-latest-4core
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Extract short git SHA
        run: echo "GIT_REF=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Log in to Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}

      - name: Build and push Docker image to Github Container registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./py${{ format(matrix.python-version, '.') }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: GIT_REF=${{ env.GIT_REF }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:${{ env.GIT_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  internal-images:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        python-version: ['3{0}10', '3{0}11', '3{0}12', '3{0}13', '3{0}14']
    runs-on: ubuntu-latest-4core
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}:role/github-actions
          aws-region: us-west-2

      - name: Extract short git SHA
        run: echo "GIT_REF=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Log in to ECR
        run: aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin "${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./py${{ format(matrix.python-version, '.') }}/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: GIT_REF=${{ env.GIT_REF }}
          tags: |
            ${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:latest
            ${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:${{ env.GIT_REF }}
          cache-from: type=registry,ref=${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:buildcache
          cache-to: type=registry,ref=${{ env.MODEL_UPLOADS_ECR_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/${{ env.IMAGE_NAME }}_py_${{ format(matrix.python-version, '_') }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
